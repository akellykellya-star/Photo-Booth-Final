[camera]
# OpenCV camera device index.
device = 16

# Requested image dimensions and frame rate.
# A value of 0 asks OpenCV to use the camera/backend default.
width = 1280
height = 720
fps = 30.0

# Optional four-character codec request, for example "MJPG".
# Leave empty to use the backend default.
fourcc = ""

[preview]
# Mirror the displayed preview horizontally.
mirror = false

# Clockwise rotation of the displayed preview: 0, 90, 180, or 270 degrees.
rotation = 0

window_name = "Photo Booth"

[capture]
# Used as the base filename for captured photos.
# The application automatically creates unique names such as
# captured_image_001.png, captured_image_002.png, etc.
output_filename = "captured_image.png"

# Number of frames discarded before a single-image capture.
# This gives auto-exposure and automatic white balance time to settle.
warmup_frames = 10

[processing]
# Swap the blue and red channels on every frame when enabled.
channel_swap_enabled = false
